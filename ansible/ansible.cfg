[defaults]
inventory = inventory.ini
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
timeout = 60
gathering = smart

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPath=~/.ssh/ansible-%r@%h:%p -o ControlPersist=300s -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
