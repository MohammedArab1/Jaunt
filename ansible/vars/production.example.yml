---
# Copy this file to ansible/vars/production.yml (gitignored), or encrypt the
# copy with `ansible-vault encrypt ansible/vars/production.yml`.
#
# Leave this empty to adopt the password that already exists in the server
# checkout's .env (jaunt_app_dir). On a brand-new server, set a long random
# password here.
#
# If the server already has a database volume, the playbook refuses to change
# the password automatically: the PostgreSQL role keeps its original password,
# so changing only .env would lock the app out of its own data.
jaunt_postgres_password: ""

# Optional overrides:
# jaunt_domain: jaunt.example.com
# jaunt_session_days: 180
# jaunt_web_port: 8080
# jaunt_api_replicas: 3

# Optional Google sign-in (OpenID Connect). Create a Web application OAuth
# client and register:
#   <PUBLIC_URL>/api/auth/oauth/google/callback
# Keep the secret here, not in group_vars.
# jaunt_google_client_id: "1234567890-abc.apps.googleusercontent.com"
# jaunt_google_client_secret: "replace-me"
# jaunt_public_url: https://jaunt.example.com
