---
# Where the app is checked out on the server.
jaunt_app_dir: /home/mohammed-arab/Desktop/Programming/Jaunt

# The deploy user owns the checkout, .env, and backups. The playbook runs as
# this user over SSH (no sudo/become), so it must be able to run Docker.
jaunt_deploy_user: "{{ ansible_user | default('mohammed-arab') }}"

# GitHub is the source of truth. The server fetches this branch and hard-resets
# to it; local uncommitted work is never sent to the server.
jaunt_repo_url: "https://github.com/MohammedArab1/Jaunt.git"
jaunt_repo_branch: main

# Keep the Compose project name stable across deploys. It matches the
# deployment directory and the existing container names on the host.
jaunt_compose_project_name: jaunt

# Number of stateless API replicas behind nginx. The deploy script reads this
# value, so it is the single source of truth for the replica count.
jaunt_api_replicas: 3

# Web port. The container still listens on port 80 internally. The host
# binding is controlled by jaunt_web_bind: keep 127.0.0.1 when a Cloudflare
# Tunnel or another local proxy forwards to it, or use 0.0.0.0 to expose it
# directly.
jaunt_web_port: 8080
jaunt_web_bind: 127.0.0.1

# Local-only PostgreSQL port for debugging. The container is not exposed
# on the public interface.
jaunt_db_port: 55432

# Login session lifetime.
jaunt_session_days: 180

# Public hostname. This only controls whether session cookies are marked
# secure; the playbook does not manage Cloudflare Tunnel, DNS, or TLS. Leave
# empty for an HTTP-only deployment.
jaunt_domain: "planjaunt.com"
jaunt_cookie_secure: "{{ (jaunt_domain | length > 0) | lower }}"

# Pre-deploy database dumps.
jaunt_backup_dir: "{{ jaunt_app_dir }}/backups"
jaunt_backup_retention_days: 14

# Docker housekeeping. This host runs several other apps, so only remove
# dangling images and build cache older than this window. Never run a global
# volume prune here.
jaunt_prune_images: true
jaunt_prune_builder: true
# Builder cache older than this is removed after each deploy. Set to 0s to
# wipe all build cache every time; 24h keeps deploys fast without unbounded
# growth.
jaunt_builder_cache_until: 24h
jaunt_keep_previous_images: true

# Swap is managed by the host OS. The playbook runs as a normal user now, so
# it cannot create/enable /swapfile or edit /etc/fstab. Set this to true only
# if you also run the playbook with privilege escalation.
jaunt_manage_swap: false
jaunt_swap_file: /swapfile
jaunt_swap_size_mb: 2048

# Post-deploy verification.
jaunt_health_url: "http://127.0.0.1:{{ jaunt_web_port }}/api/health"
jaunt_health_retries: 40
jaunt_health_delay: 3
