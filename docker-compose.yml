services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jaunt
      POSTGRES_USER: jaunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create a .env from .env.example and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - jaunt_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaunt -d jaunt"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./server
      args:
        CACHEBUST: ${CACHEBUST:-0}
    environment:
      NODE_ENV: production
      PORT: 3100
      PGHOST: db
      PGPORT: 5432
      PGUSER: jaunt
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create a .env from .env.example and set POSTGRES_PASSWORD}
      PGDATABASE: jaunt
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Stateless; the web container load-balances across these replicas.
    deploy:
      replicas: ${API_REPLICAS:-3}

  web:
    build:
      context: .
      args:
        CACHEBUST: ${CACHEBUST:-0}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jaunt_db:
