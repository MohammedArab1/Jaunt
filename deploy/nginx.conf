server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 30m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3100;

    # Cloudflare Tunnel connects from the local host or Docker bridge. Trust
    # Cloudflare's client-IP header only from those sources, then pass one
    # canonical client address to the API. Keep the web port bound to
    # 127.0.0.1 (the Ansible default) when using these trusted ranges.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 30m;
    }

    # Never cache the service worker; the app handles updates explicitly.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fingerprinted build assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ES module workers (PDF.js) need a JavaScript MIME type.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:png|ico|svg|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA fallback for /calendar, /trips/:id, /settings, etc.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
