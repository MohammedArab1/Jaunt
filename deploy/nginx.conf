# Only public share pages need a robots header; the rest of the app is private.
map $request_uri $jaunt_robots_tag {
    default "";
    ~^/share/ "noindex, nofollow";
}

# Short TTL so a replaced API container drops out of the upstream quickly.
resolver 127.0.0.11 valid=2s ipv6=off;

# The API runs as multiple Compose replicas. Resolve the service name through
# Docker DNS at runtime and load-balance across the returned containers.
upstream api_backend {
    zone api_backend 64k;
    server api:3100 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 30m;

    # Cloudflare Tunnel connects from the local host or a private Docker/LAN
    # bridge. Trust Cloudflare's client-IP header only from those sources, then
    # pass one canonical client address to the API. Keep the web port bound to
    # 127.0.0.1 (the Ansible default) when using these trusted ranges.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag $jaunt_robots_tag always;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Helmet sets these too; keep nginx as the single source for shared headers.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        # Retry another API replica on connection errors or a restarting peer.
        # Nginx only retries non-idempotent requests when explicitly allowed.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        client_max_body_size 30m;
    }

    # Never cache the service worker; the app handles updates explicitly.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fingerprinted build assets.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ES module workers (PDF.js) need a JavaScript MIME type.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:png|ico|svg|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Dotfiles and non-app directories must not fall through to the SPA shell.
    location ~ /\. {
        return 404;
    }

    location ~ ^/(?:backups|server|deploy|ansible|node_modules)(?:/|$) {
        return 404;
    }

    # Files must exist; only extensionless app routes use the SPA fallback.
    location ~ \.[A-Za-z0-9]+$ {
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback for /calendar, /trips/:id, /settings, etc.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
